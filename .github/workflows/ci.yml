name: CI Pipeline

on:
  push:
    branches:
      - main
      - backend
  pull_request:
    branches:
      - main
      - backend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: p2p_admin
          POSTGRES_PASSWORD: p2p_password
          POSTGRES_DB: p2p_interview_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p2p_admin -d p2p_interview_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://p2p_admin:p2p_password@localhost:5432/p2p_interview_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-key-for-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @p2p/db db:generate || pnpm --filter @arcmentor/db db:generate

      - name: Typecheck all packages
        run: pnpm run check-types

      - name: Run linter
        run: pnpm run lint

      - name: Run test suites
        run: pnpm test
