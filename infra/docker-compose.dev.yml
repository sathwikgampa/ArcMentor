services:
  postgres:
    image: postgres:16-alpine
    container_name: p2p_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: p2p_interview_db
      POSTGRES_USER: p2p_admin
      POSTGRES_PASSWORD: p2p_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U p2p_admin -d p2p_interview_db']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: p2p_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  livekit:
    image: livekit/livekit-server:latest
    container_name: arcmentor-livekit
    restart: unless-stopped
    command: --dev
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'

volumes:
  postgres_data:
    name: p2p_postgres_data
  redis_data:
    name: p2p_redis_data
