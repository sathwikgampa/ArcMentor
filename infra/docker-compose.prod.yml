version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.arcmentor.com
    expose:
      - '3000'

  api-gateway:
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/arcmentor
      - REDIS_URL=redis://redis:6379
    expose:
      - '4000'

  ws-server:
    build:
      context: ..
      dockerfile: apps/ws-server/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    expose:
      - '5001'

  executor-service:
    build:
      context: ..
      dockerfile: apps/executor-service/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
    expose:
      - '5002'

  background-workers:
    build:
      context: ..
      dockerfile: apps/background-workers/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/arcmentor
      - REDIS_URL=redis://redis:6379

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api-gateway
      - ws-server
